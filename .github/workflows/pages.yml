# Ratsatlas Köln: Daten der Kölner OParl-API abrufen, aufbereiten und veröffentlichen (CLAUDE.md 5.1, 7.5).
# Die fertige Seite geht in den Branch `deploy` (Plesk-Git auf koeln.ratsatlas.de holt ihn per Webhook; flacher Klon, ein
# Commit je Lauf: die Historie wächst um die Änderungen, Plesk-Git räumt mit git gc auf) und auf den Spiegel bei GitHub
# Pages (Canonical auf die Hauptadresse).
#
# Sperre: Der Abruf läuft erst, wenn die Repository-Variable RATSATLAS_STADT_INFORMIERT den Wert „ja“ hat
# (Einstellungen → Secrets and variables → Actions → Variables). Bis dahin – und bis ein vollständiger Abruf vorliegt –
# veröffentlicht der Lauf eine Kartenvorschau ohne Ratsvorlagen (Gebiete, Kennzahlen, Ebenen; Entscheidung 07.11.2026).
# Weitere Variablen: RATSATLAS_KONTAKT (Kontakt im User-Agent, Pflicht: ohne ihn bricht der freigegebene Abruf vor der
# ersten Anfrage als Einstellungsfehler ab), SITE_URL (Vorgabe https://koeln.ratsatlas.de/).
# Abhilfen, die der Abruf in STAND.json und im Log nennt (der Zustand liegt im Zwischenspeicher dieses Workflows, ein
# Lauf an anderer Stelle hilft nicht): RATSATLAS_VOLLABRUF („ja“ oder Listen, etwa „meetings“: Vollabruf statt
# modified_since, über Nächte fortgesetzt) und RATSATLAS_KUERZER_ANNEHMEN (Listen, etwa „organizations“: kürzeren
# Vollabruf annehmen). Nur so lange setzen wie nötig: „ja“ und KUERZER_ANNEHMEN für eine Nacht (danach löschen, sonst
# jede Nacht ein Vollabruf der Vorlagen, rund 900 Anfragen); „meetings“ darf nur bleiben, wenn die Stadt
# modified_since bei den Sitzungen ablehnt (etwa HTTP 401; dann jede Nacht alle Sitzungen, 50–200 Seiten). Übergeht sie
# den Filter nur, braucht es die Variable nicht: Seit Runde 20 liest der Abruf die Sitzungen dann in derselben Nacht von
# selbst vollständig neu und kehrt zum inkrementellen Lauf zurück, sobald der Filter wirkt (mit dauerhaft gesetztem
# „meetings“ entfiele dieser Versuch). Eine ausgesetzte Liste (Vorlagen oder Sitzungen, deren Vollabruf über Nächte,
# deren zweiter Vollabruf in Folge – etwa mit dauerhaft gesetztem „meetings“ – oder deren vollständiges Lesen nach nicht
# angewandtem Zeitfilter unter 90 % des Stands endete; Hinweis in STAND.json unter abruf_ausgesetzt, Entscheidung
# 13.11.2026) sendet keine Anfrage, bis KUERZER_ANNEHMEN sie nennt (liest sie vollständig und nimmt den kürzeren Stand an;
# gesetzt lassen, bis der Lauf fertig ist) oder VOLLABRUF (hebt das Aussetzen auf, neuer Vollabruf ab Seite 1; eine
# Nacht). Nannte VOLLABRUF die Liste schon beim Aussetzen (dauerhaft gesetzt), hebt sie es erst auf, nachdem ein Lauf
# ohne sie die Liste erreicht hat: für eine Nacht austragen, dann wieder eintragen. Abstand, Zeitfenster und Grenzen je
# Nacht sind nicht über Variablen einstellbar; einzig RATSATLAS_PDF_MAX (Dokumentschritt, unten) kann dessen Grenze
# senken, nicht erhöhen.
# Abrufpolitik: eine Verbindung, Abstand 20 s (seit 15.11.2026, fest im Abruf- und im Dokumentschritt; der Code verlangt
# mindestens 2 s), nur 23–1 Uhr Ortszeit, Pausen nach Fehlern bis 3 h (Retry-After als
# Sekunden oder Datum eingehalten), aber nie über das Ende des Zeitfensters: Reicht die nächste Pause darüber hinaus
# oder ist Retry-After länger als 3 h oder unlesbar, gibt der Abruf sofort auf („aufgegeben“). Ein solcher Retry-After
# gilt über die Nacht hinaus: Bis zu seinem Ablauf (höchstens 30 Tage, unlesbar 7 Tage) wird jeder Lauf übersprungen.
# Nacht mit möglicher Sperre: Verbindungsabbruch, abgeschnittene oder unlesbare Antwort, HTTP 401/403/429,
# „aufgegeben“ nach 429/5xx, Weiterleitung und JSON in unerwarteter Form („unlesbar“); nach drei solchen Nächten ohne
# vollständigen Lauf sieben Tage Pause. Keine Sperrnacht: Ablehnung durch einen Proxy und ungültige Adressen (nie
# gesendet). Nach jedem Abbruch außer dem Ende des Zeitfensters, auch nach einem Programmfehler, in derselben Nacht
# (12 h) kein weiterer Lauf, auch nicht nach einem Push oder auf Knopfdruck. Ungültige Folgeadressen oder Schleifen in
# links.next: Hinweis in STAND.json und Warnung im Log, nach drei Nächten sieben Tage Pause. Ein unlesbarer
# Abrufzustand oder ein Programm- oder Einstellungsfehler bricht den Schritt mit Fehler ab (rot, ohne Sperrnacht; die
# alte Seite bleibt online, der Zustand wird trotzdem gesichert). Ein abgebrochener Vollabruf wird in der nächsten
# Nacht fortgesetzt; endet dabei das Zeitfenster, ist das kein Fehler (nur ein Hinweis in STAND.json)
# (pipeline/abruf.py, pipeline/sessionnet.py).
# Fällt der Abruf aus, wird der letzte gültige Stand aus dem Zwischenspeicher veröffentlicht und als solcher angezeigt;
# ein vollständiger Lauf entfernt die Fehlermeldung wieder.
# Dokumente (PDF-Köpfe, pipeline/dokumente.py; Entscheidung 13.11.2026: gebaut, getestet, abgeschaltet): Der Schritt nach
# dem Abruf liest die erste Seite der Hauptdatei von Verwaltungsvorlagen (fehlt sie, einer Datei aus auxiliaryFile;
# Entscheidung 13.11.2026 (a)) und übernimmt nur die Kennung „Dezernat, Dienststelle“; vermerkt werden dazu nur
# Prüfsumme, Größe und Ergebnis des Abrufs (kein Text, keine Datei). Er
# sendet nur mit RATSATLAS_PDF_FREIGEGEBEN = „ja“ (zusätzlich zu RATSATLAS_STADT_INFORMIERT) eine Anfrage; ohne sie
# schreibt er nichts (Nächte ohne Freigabe bleiben in Anfragen und Abrufzustand unverändert). RATSATLAS_PDF_MAX: Dateien
# je Nacht, senkt die Grenze von 300 nur (leer oder über 300: 300; 0, negativ oder unlesbar: keine Anfrage).
# Einschalten in dieser Reihenfolge (Entscheidung 13.11.2026 (c); Brief an die Stadt, Punkt 4: zuerst einmalig 100
# Dokumente zur Prüfung): (1) RATSATLAS_PDF_MAX=100 setzen, (2) erst dann RATSATLAS_PDF_FREIGEGEBEN=ja, (3) nach der
# Testnacht und ihrer Auswertung RATSATLAS_PDF_MAX löschen (300). Ohne (1) liest schon die erste Nacht bis zu 300
# Dateien. Dieselbe Abrufpolitik (auch der feste Abstand von 20 s, also mindestens
# 100 min für 300 Dateien; was bis 1 Uhr nicht gelesen ist, folgt in der nächsten Nacht) und derselbe Zustand wie beim
# Abruf, nach ihm und nur, wenn er in dieser Nacht vollständig war; ein Abbruch zählt wie einer des Abrufs (12-Stunden-
# Regel, Nacht mit möglicher Sperre) und nach drei Nächten mit möglicher Sperre beim Dokumentabruf ruhen die Dokumente
# sieben Tage. Ein Fehler in diesem Schritt hält die Veröffentlichung nicht an; er hat ein eigenes Zeitlimit (150 min).
# Der Zwischenspeicher (Rohdaten, Zustand des Abrufs mit der Zählung der Nächte, STAND.json, Abrufstatistik) wird gleich
# nach dem Abrufschritt gesichert, auch wenn der Abruf oder ein späterer Schritt scheitert; mit Freigabe des
# Dokumentschritts nach diesem ein zweites Mal (eigener Schlüssel; der nächste Lauf nimmt den jüngsten Stand). Gleich
# nach der ersten Sicherung steht der Fortschritt des Abrufs im Log und in der Zusammenfassung des Laufs
# (tools/abrufstand.py, nur Zahlen und Zustände), dann die Feldabdeckung der Rohdaten (tools/feldabdeckung.py, nur
# Anzahlen, Anteile und häufige Kategorien; während des Vollabrufs als Zwischenstand); beide Schritte lesen nur und
# halten den Lauf nie an. Erst danach folgen der Dokumentschritt und seine Sicherung.
# Fehlt nach dem Wiederherstellen der Zustand des Abrufs (data/raw/zustand_abruf.json), hält ein Wächter den
# freigegebenen Lauf vor dem Abruf an (rot: kein Abruf, keine Dokumente, keine Veröffentlichung, keine Sicherung);
# überstimmen nur mit RATSATLAS_VOLLABRUF=ja (neuer Vollabruf ab Seite 1, gesetzt lassen, bis eine Abrufnacht gelaufen
# ist).
name: Daten aktualisieren und Seite veröffentlichen

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "10 22 * * *"   # 23:10 Uhr, im Sommer 0:10 Uhr Ortszeit (beides im Zeitfenster 23–1 Uhr)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Pausen nach Fehlern (Backoff) enden spätestens mit dem Zeitfenster (höchstens knapp 2 h)
    permissions:
      contents: write   # Branch deploy
      pages: read
    outputs:
      daten: ${{ steps.daten.outputs.da }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      # Rohdaten-Cache: letzter gültiger Stand, Zustand des inkrementellen Abrufs, Abrufstatistik. Hier nur
      # Wiederherstellen; gesichert wird im Schritt direkt nach dem Abruf, nicht erst am Ende eines erfolgreichen Laufs
      # (data/raw/ ändert nach dem Abruf nur noch der Dokumentschritt, nach dem mit seiner Freigabe ein zweites Mal
      # gesichert wird)
      - name: Rohdaten des letzten Laufs
        id: rohdaten
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-

      # Wächter (16.11.2026, Prüfung stapelf): Fehlt nach dem Wiederherstellen der Zustand des Abrufs (etwa nach einer
      # Störung des Dienstes, nach dem Löschen eines Eintrags oder weil eine neue Fassung von actions/cache ältere
      # Einträge raw- nicht findet; actions/cache meldet das nur als Hinweis), begänne der Abruf ab Seite 1: Die Zählung
      # der Nächte mit möglicher Sperre, nicht_vor, die Fortsetzung des Vollabrufs und die Zählung der Dokumente gingen
      # verloren, der Lauf veröffentlichte die Kartenvorschau, und die Sicherung legte den fast leeren Stand als jüngsten
      # Eintrag raw- ab. Mit Freigabe des Abrufs hält der Lauf deshalb hier an (rot): Abruf, Dokumente, Veröffentlichung
      # und beide Sicherungen entfallen (die Sicherungen hängen an übersprungenen Schritten ohne eigenes if: Abruf bzw.
      # Dokumente), die Seite bleibt, wie sie ist. Maßgeblich ist die Datei selbst, nicht nur die Ausgabe der Aktion;
      # ohne Freigabe (Kartenvorschau) kein Halt. Überstimmen nur ausdrücklich mit RATSATLAS_VOLLABRUF=ja (ohne Zustand
      # ohnehin ein Vollabruf ab Seite 1)
      - name: Abrufzustand wiederhergestellt? (Wächter vor Abruf und Veröffentlichung)
        env:
          GEFUNDEN: ${{ steps.rohdaten.outputs.cache-matched-key }}
          RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
          RATSATLAS_VOLLABRUF: ${{ vars.RATSATLAS_VOLLABRUF }}
        run: |
          echo "Zwischenspeicher: ${GEFUNDEN:-keiner wiederhergestellt}"
          if [ -f data/raw/zustand_abruf.json ] || [ "$RATSATLAS_STADT_INFORMIERT" != "ja" ]; then exit 0; fi
          if [ "$RATSATLAS_VOLLABRUF" = "ja" ]; then
            echo "::warning::Kein Abrufzustand (data/raw/zustand_abruf.json) im Zwischenspeicher; mit RATSATLAS_VOLLABRUF=ja beginnt der Abruf ohne ihn (Vollabruf ab Seite 1, Zählung der Nächte mit möglicher Sperre von vorn). Nach der ersten Abrufnacht den vorigen Wert der Variablen wiederherstellen (meist: löschen)."
            exit 0
          fi
          echo "::error::Kein Abrufzustand (data/raw/zustand_abruf.json) im Zwischenspeicher: Der Abruf begänne ab Seite 1, die Zählung der Nächte mit möglicher Sperre, nicht_vor, die Fortsetzung des Vollabrufs und die Zählung der Dokumente gingen verloren. Daher kein Abruf, keine Dokumente, keine Veröffentlichung, keine Sicherung; die Seite bleibt, wie sie ist. Prüfen: Log von „Rohdaten des letzten Laufs“ und Actions → Caches (Einträge raw-). Vorübergehende Störung: Lauf wiederholen. Findet eine neue Fassung von actions/cache die älteren Einträge nicht: auf die vorige Fassung zurückstellen (GitHub löscht Einträge, die 7 Tage nicht gelesen wurden). Nur beim ersten Lauf überhaupt oder wenn der Zustand verloren ist: Repository-Variable RATSATLAS_VOLLABRUF=ja, bis eine Abrufnacht gelaufen ist; vorher in der Zusammenfassung „Abrufstand“ des letzten Laufs mit Zustand prüfen, ob eine Pause lief (Retry-After, 7 Tage nach drei Nächten mit möglicher Sperre), und erst nach ihrem Ende überstimmen. Bis der neue Vollabruf vollständig ist, zeigt die Seite dann die Kartenvorschau."
          exit 1

      # Dauer: höchstens bis zum Ende des Zeitfensters (1 Uhr) plus eine Anfrage (Zeitüberschreitung 90 s); mit 100
      # Objekten je Seite (limit=100, rund 5 s je Antwort, 20 s Abstand) rund 280 Seiten je Nacht (TECHNIK.md). Das
      # Zeitlimit des Jobs (300 min) reicht; kein eigenes Zeitlimit für den Schritt (ein Abbruch von außen schriebe
      # keinen Zustand)
      - name: Abruf OParl-API Stadt Köln (gesperrt bis zur Information der Stadt)
        id: abruf
        env:
          RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
          RATSATLAS_KONTAKT: ${{ vars.RATSATLAS_KONTAKT }}
          # Abhilfen aus den Hinweisen (siehe Kopf); leer ohne Wirkung
          RATSATLAS_VOLLABRUF: ${{ vars.RATSATLAS_VOLLABRUF }}
          RATSATLAS_KUERZER_ANNEHMEN: ${{ vars.RATSATLAS_KUERZER_ANNEHMEN }}
          # Abstand fest 20 s statt 2 s (Entscheidung 15.11.2026): In den Nächten zum 14. und 15.11. antwortete der
          # Server jeweils etwa 68 s nach dem Start nicht mehr (Zeitüberschreitung bei Seite 12 bzw. 20), vermutlich
          # eine Drosselung je Minute. Kein Repository-Variable: nur über eine Änderung an dieser Datei
          RATSATLAS_ABSTAND: "20"
        run: python -m pipeline fetch

      # Sofort sichern, auch wenn der Abruf oder ein späterer Schritt scheitert: Sonst ginge die Zählung der Nächte mit
      # möglicher Sperre (sperre_verdacht in zustand_abruf.json) verloren, und die Pause nach drei Nächten bliebe aus.
      # Schlüssel je Versuch, damit auch ein wiederholter Lauf speichert; der nächste Lauf nimmt den jüngsten (raw-).
      - name: Abrufzustand sichern (Rohdaten, zustand_abruf.json, STAND.json, Abrufstatistik)
        if: always() && steps.abruf.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      # Fortschritt des Abrufs ins Log und in die Zusammenfassung des Laufs: je Liste Anfragen und Objekte der letzten
      # Nacht, Seiten bisher, Stelle der Fortsetzung, gespeicherter Stand, Zähler der Nächte mit möglicher Sperre und
      # Pause, letzter Abbruch, wie die Nacht endete, abruf_ok; dazu der Dokumentschritt im Stand vor seinem Lauf
      # (angefragte Dateien der letzten Nacht mit Freigabe, Nächte mit möglicher Sperre beim Dokumentabruf, letzte
      # Zeile der Abrufstatistik). Liest nur zustand_abruf.json, STAND.json und abrufstatistik.tsv; nur Zahlen und
      # Zustände, keine Inhalte der Objekte und keine Meldungstexte (außer dem Grund eines übersprungenen Laufs, aus
      # festen Texten des Abrufs). Immer, auch nach einem gescheiterten oder übersprungenen Abruf; fehlende oder
      # unlesbare Dateien sind kein Fehler, und der Schritt hält den Lauf nie an
      - name: Fortschritt des Abrufs (Log und Zusammenfassung)
        if: always()
        continue-on-error: true
        run: python tools/abrufstand.py

      # Feldabdeckung der Rohdaten (Entscheidung 16.11.2026): wie vollständig die Felder der Vorlagen, Sitzungen und
      # Gremien gefüllt sind (underDirectionOf, originator*, mainFile/auxiliaryFile, location, agendaItem.result, Arten
      # der Vorlagen und Gremien), während des Vollabrufs als Zwischenstand aus fertiger Datei und Teildatei. Liest nur
      # data/raw und data/geo; nur Anzahlen, Anteile und häufige Kategorien im Log und in der Zusammenfassung, keine
      # Inhalte der Objekte; schreibt nichts, veröffentlicht nichts, ohne Variablen und Geheimnisse. Immer, auch nach
      # einem gescheiterten oder übersprungenen Abruf; hält den Lauf nie an (Exit-Code 0, Frist im Skript 7 Minuten)
      - name: Feldabdeckung der Rohdaten (nur Zahlen)
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: python tools/feldabdeckung.py

      # Dokumente (PDF-Köpfe) nach dem Abruf, seiner Sicherung, dem Fortschritt und der Feldabdeckung, im selben
      # Zeitfenster und nach derselben Abrufpolitik (eigener Prozess: der Abstand von 20 s zählt ab seinem Start, also
      # auch zur letzten Anfrage des Abrufs); nur mit RATSATLAS_PDF_FREIGEGEBEN=ja, sonst keine Anfrage und nichts
      # geschrieben (siehe Kopf). Läuft nicht nach einem roten Abrufschritt (kein eigenes `if`, also auch nicht nach
      # einem roten Wächter). Die beiden lesenden Schritte davor verkürzen nur die Zeit bis 1 Uhr (die Feldabdeckung
      # höchstens um ihr Zeitlimit von 10 Minuten); was bis dahin nicht gelesen ist, folgt in der nächsten Nacht.
      # Eigenes Zeitlimit als letzte Sicherung: Das Zeitfenster endet um 1 Uhr und jede Datei hat höchstens 120 s; der
      # Zustand wird vor jeder Anfrage geschrieben, ein Abbruch von außen verliert höchstens die laufende Datei
      - name: Dokumente der Stadt Köln (PDF-Köpfe, gesperrt bis zur Freigabe)
        id: dokumente
        continue-on-error: true
        timeout-minutes: 150
        env:
          RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
          RATSATLAS_KONTAKT: ${{ vars.RATSATLAS_KONTAKT }}
          RATSATLAS_PDF_FREIGEGEBEN: ${{ vars.RATSATLAS_PDF_FREIGEGEBEN }}
          RATSATLAS_PDF_MAX: ${{ vars.RATSATLAS_PDF_MAX }}
          # Abstand fest 20 s wie im Abrufschritt (Entscheidung 15.11.2026); ohne die Angabe gälte in diesem eigenen
          # Prozess die Vorgabe von 2 s. Keine Repository-Variable: nur über eine Änderung an dieser Datei
          RATSATLAS_ABSTAND: "20"
        run: python -m pipeline dokumente

      # Zweite Sicherung nur mit Freigabe des Dokumentschritts (ohne sie schreibt er nichts): Ergebnisse, Zählung der
      # Nacht und Abbrüche im Zustand; auch nach einem Fehler oder dem Zeitlimit des Schritts. Eigener Schlüssel, der
      # nächste Lauf nimmt den jüngsten (raw-)
      - name: Abrufzustand nach den Dokumenten sichern
        if: always() && steps.dokumente.outcome != 'skipped' && vars.RATSATLAS_STADT_INFORMIERT == 'ja' && vars.RATSATLAS_PDF_FREIGEGEBEN == 'ja'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}-dokumente

      # Nie mit Testdaten veröffentlichen (tools/testdaten.py setzt „testdaten“ in STAND.json)
      - name: Gibt es Daten zum Veröffentlichen?
        id: daten
        run: |
          # erst nach einem vollständigen Abruf (abruf_ok); ein Vollabruf kann sich über mehrere Nächte erstrecken
          if [ -s data/raw/papers.jsonl ] && python -c 'import json,sys; s=json.load(open("data/raw/STAND.json")); sys.exit(0 if s.get("abruf_ok") and not s.get("testdaten") else 1)' 2>/dev/null; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
            echo "raw=data/raw" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Noch keine Daten der Stadt Köln – Kartenvorschau ohne Ratsvorlagen."
            echo "da=vorschau" >> "$GITHUB_OUTPUT"
            echo "raw=data/raw_vorschau" >> "$GITHUB_OUTPUT"
          fi

      - name: Kartenvorschau (leere Rohdaten in eigenem Verzeichnis)
        if: steps.daten.outputs.da == 'vorschau'
        env:
          RATSATLAS_RAW: ${{ steps.daten.outputs.raw }}
        run: python tools/vorschau.py

      - name: Aufbereiten, Geokodierung, Export, Kennzahlen, Ebenen, Datenpaket
        env:
          RATSATLAS_RAW: ${{ steps.daten.outputs.raw }}
        run: |
          python -m pipeline build
          python -m pipeline export
          python -m pipeline kontext
          python -m pipeline ebenen
          python -m pipeline check     # Datenschutz (keine Hauskoordinaten bei Eingaben), Kennzahlen; Befunde halten die Veröffentlichung an
          python -m pipeline package

      # Graue Kartenkacheln aus dem Branch kacheln (kacheln.yml); fehlt er, zeigt die Seite OSM-Kacheln grau gefiltert
      - name: Graue Kartenkacheln holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: kacheln
          path: _kacheln
        continue-on-error: true

      # Audit-Protokolle, Stichproben und Abrufstatistik kommen nicht als lose Dateien auf die Seite (also weder in den
      # Branch deploy noch auf den Spiegel), sondern nur ins Datenpaket (Entscheidung 10.11.2026, tools/seite_bauen.py
      # NUR_IM_PAKET); das Paket entsteht im Schritt davor aus ganz data/export und enthält sie daher
      - name: Seite zusammenstellen (Frontend, Exporte, Flächen, Kacheln, Adressen für SITE_URL)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://koeln.ratsatlas.de/' }}
        run: python tools/seite_bauen.py _site

      # Keine Veröffentlichung mit defekten inneren Links oder Sprungmarken (Phase 6)
      - name: Linkprüfung (innere Links)
        run: python tools/linkpruefung.py _site

      # Flacher Klon, ein Commit je Lauf: Die Historie wächst um die Änderungen (Plesk-Git räumt mit git gc auf). Ohne
      # Datenpaket (Zip, täglich vollständig neu, es käme jeden Tag ganz hinzu); auf dem eigenen Server verweist der Link
      # auf das Paket beim Spiegel (config.PAKET_URL). Größenwache: GitHub nimmt höchstens 100 MB je Datei an (in der
      # Generalprobe lag audit_prozess.tsv bei 98,3 MB; die Audits liegen seit dem 10.11.2026 nur im Datenpaket). Jede
      # Datei über 95 MB (95 000 000 Byte) bleibt mit Warnung im Log draußen (sie liegt im Datenpaket und auf dem
      # Spiegel GitHub Pages); der Push läuft weiter
      - name: Fertige Seite in den Branch deploy schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Exit-Code 2: Branch fehlt; jeder andere Fehler (Netz) bricht ab, statt mit leerem Bestand weiterzumachen
          rc=0; git ls-remote --exit-code --heads "$url" deploy > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "Abfrage des Branches deploy gescheitert ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch deploy "$url" _deploy
          else
            git init -q -b deploy _deploy
          fi
          find _deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _site/. _deploy/
          rm -f _deploy/data/export/ratsatlas-koeln-export.zip
          find _deploy -path _deploy/.git -prune -o -type f -size +95000000c -print | while IFS= read -r datei; do
            mb=$(awk -v b="$(stat -c %s "$datei")" 'BEGIN { printf "%.1f", b / 1000000 }' | tr . ,)
            echo "::warning::${datei#_deploy/} (${mb} MB) nicht im Branch deploy: GitHub nimmt höchstens 100 MB je Datei an; liegt im Datenpaket und auf dem Spiegel GitHub Pages"
            rm -f "$datei"
          done
          cp deploy/htaccess _deploy/.htaccess
          paket=$(python -c 'from pipeline import config; print(config.PAKET_URL)')
          sed -i "s|href=\"data/export/ratsatlas-koeln-export.zip\"|href=\"${paket}\"|" _deploy/index.html
          cd _deploy
          git add -A
          if git diff --cached --quiet; then echo "Seite unverändert"; exit 0; fi
          git commit -q -m "Seite aus ${GITHUB_SHA::7}, erzeugt $(date -u +%F)"
          git push -q "$url" HEAD:deploy

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: "_site"

  deploy:
    needs: build
    if: needs.build.outputs.daten != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Wartezeit 20 statt 10 min: Am 09.11.2026 stand die Übergabe bei GitHub rund 10 min in Warteschlange und
      # Dateiabgleich und brach ab, obwohl das Paket so groß war wie sonst (54 MB, sonst unter 1 min)
      - name: Auf GitHub Pages veröffentlichen (Spiegel)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          timeout: 1200000   # Millisekunden
