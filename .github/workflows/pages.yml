# Ratsatlas Köln: Daten der Kölner OParl-API abrufen, aufbereiten und veröffentlichen (CLAUDE.md 5.1, 7.5).
# Die fertige Seite geht in den Branch `deploy` (ohne Historie der Seite; Plesk-Git auf koeln.ratsatlas.de holt ihn per
# Webhook) und auf den Spiegel bei GitHub Pages (Canonical auf die Hauptadresse).
#
# Sperre: Der Abruf läuft erst, wenn die Repository-Variable RATSATLAS_STADT_INFORMIERT den Wert „ja“ hat
# (Einstellungen → Secrets and variables → Actions → Variables). Bis dahin – und bis ein vollständiger Abruf vorliegt –
# veröffentlicht der Lauf eine Kartenvorschau ohne Ratsvorlagen (Gebiete, Kennzahlen, Ebenen; Entscheidung 07.11.2026).
# Weitere Variablen: RATSATLAS_KONTAKT (Kontakt im User-Agent), SITE_URL (Vorgabe https://koeln.ratsatlas.de/).
# Abrufpolitik: eine Verbindung, Abstand 2 s, nur 23–1 Uhr Ortszeit, Pausen nach Fehlern bis 3 h, Verbindungsabbruch =
# mögliche Sperre (Abbruch, nach drei Nächten sieben Tage Pause); ein abgebrochener Vollabruf wird in der nächsten Nacht
# fortgesetzt (pipeline/abruf.py, pipeline/sessionnet.py).
# Fällt der Abruf aus, wird der letzte gültige Stand aus dem Zwischenspeicher veröffentlicht und als solcher angezeigt.
name: Daten aktualisieren und Seite veröffentlichen

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "10 22 * * *"   # 23:10 Uhr, im Sommer 0:10 Uhr Ortszeit (beides im Zeitfenster 23–1 Uhr)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # Pausen nach Fehlern können Stunden dauern (Backoff)
    permissions:
      contents: write   # Branch deploy
      pages: read
    outputs:
      daten: ${{ steps.daten.outputs.da }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      # Rohdaten-Cache: letzter gültiger Stand, Zustand des inkrementellen Abrufs, Abrufstatistik
      - name: Rohdaten des letzten Laufs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            data/raw/
            data/export/abrufstatistik.tsv
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Abruf OParl-API Stadt Köln (gesperrt bis zur Information der Stadt)
        env:
          RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
          RATSATLAS_KONTAKT: ${{ vars.RATSATLAS_KONTAKT }}
        run: python -m pipeline fetch

      # Nie mit Testdaten veröffentlichen (tools/testdaten.py setzt „testdaten“ in STAND.json)
      - name: Gibt es Daten zum Veröffentlichen?
        id: daten
        run: |
          # erst nach einem vollständigen Abruf (abruf_ok); ein Vollabruf kann sich über mehrere Nächte erstrecken
          if [ -s data/raw/papers.jsonl ] && python -c 'import json,sys; s=json.load(open("data/raw/STAND.json")); sys.exit(0 if s.get("abruf_ok") and not s.get("testdaten") else 1)' 2>/dev/null; then
            echo "da=ja" >> "$GITHUB_OUTPUT"
            echo "raw=data/raw" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Noch keine Daten der Stadt Köln – Kartenvorschau ohne Ratsvorlagen."
            echo "da=vorschau" >> "$GITHUB_OUTPUT"
            echo "raw=data/raw_vorschau" >> "$GITHUB_OUTPUT"
          fi

      - name: Kartenvorschau (leere Rohdaten in eigenem Verzeichnis)
        if: steps.daten.outputs.da == 'vorschau'
        env:
          RATSATLAS_RAW: ${{ steps.daten.outputs.raw }}
        run: python tools/vorschau.py

      - name: Aufbereiten, Geokodierung, Export, Kennzahlen, Ebenen, Datenpaket
        env:
          RATSATLAS_RAW: ${{ steps.daten.outputs.raw }}
        run: |
          python -m pipeline build
          python -m pipeline export
          python -m pipeline kontext
          python -m pipeline ebenen
          python -m pipeline check     # Datenschutz (keine Hauskoordinaten bei Eingaben), Kennzahlen; Befunde halten die Veröffentlichung an
          python -m pipeline package

      # Graue Kartenkacheln aus dem Branch kacheln (kacheln.yml); fehlt er, zeigt die Seite OSM-Kacheln grau gefiltert
      - name: Graue Kartenkacheln holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: kacheln
          path: _kacheln
        continue-on-error: true

      - name: Seite zusammenstellen (Frontend, Exporte, Flächen, Kacheln, Adressen für SITE_URL)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://koeln.ratsatlas.de/' }}
        run: python tools/seite_bauen.py _site

      # Keine Veröffentlichung mit defekten inneren Links oder Sprungmarken (Phase 6)
      - name: Linkprüfung (innere Links)
        run: python tools/linkpruefung.py _site

      # Ohne Datenpaket (Zip, täglich vollständig neu), damit die Historie nur um die Änderungen wächst; auf dem eigenen
      # Server verweist der Link auf das Paket beim Spiegel (config.PAKET_URL)
      - name: Fertige Seite in den Branch deploy schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Exit-Code 2: Branch fehlt; jeder andere Fehler (Netz) bricht ab, statt mit leerem Bestand weiterzumachen
          rc=0; git ls-remote --exit-code --heads "$url" deploy > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "Abfrage des Branches deploy gescheitert ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch deploy "$url" _deploy
          else
            git init -q -b deploy _deploy
          fi
          find _deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _site/. _deploy/
          rm -f _deploy/data/export/ratsatlas-koeln-export.zip
          cp deploy/htaccess _deploy/.htaccess
          paket=$(python -c 'from pipeline import config; print(config.PAKET_URL)')
          sed -i "s|href=\"data/export/ratsatlas-koeln-export.zip\"|href=\"${paket}\"|" _deploy/index.html
          cd _deploy
          git add -A
          if git diff --cached --quiet; then echo "Seite unverändert"; exit 0; fi
          git commit -q -m "Seite aus ${GITHUB_SHA::7}, erzeugt $(date -u +%F)"
          git push -q "$url" HEAD:deploy

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: "_site"

  deploy:
    needs: build
    if: needs.build.outputs.daten != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen (Spiegel)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
