# Tests der Pipeline mit synthetischen Daten und lokalem Testserver; keine Anfragen an Server der Stadt Köln
# (Entscheidung 04.11.2026: einziger aktiver Workflow bis Phase 5). Job „browser“ (Entscheidungen 19.11.2026 (1) (G)
# und 24.11.2026 (2) (2) A): Seite mit Testdaten im Browser, parallel zum Job „test“; dazu ein zweiter Bau mit den
# Themenseiten (Entscheidung 24.11.2026 (3), Prüfschalter nur mit Testdaten).
name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Zeitlimit 30 statt 15 Minuten (Prüfung stj): Der Job brauchte auf main am 16.11.2026 11,5 bis 15,0 Minuten
    # (einmal 14:59), mit den Tests des Dokumentschritts gut eine Minute mehr; --durations zeigt die langsamsten Tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Pipeline (Abruf gegen Testserver, Aufbereitung, Geokodierung, Geodaten)
        run: python -m pytest -v --durations=20 tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      # Alle Skripte der Seite (mit Unterordnern wie site/chat und site/vendor), der Browserprüfungen und der Werkzeuge.
      # ES-Module (import oder export am Zeilenanfang; app.js lädt sie mit import()) prüft node über die
      # Standardeingabe als Modul: `node --check datei.js` meldet in Node 22 einen Syntaxfehler in einer Datei mit
      # export nicht (Exit-Code 0, geprüft mit 22.23.4)
      - name: Syntax der Webseite
        run: |
          for f in $(find site tests/browser tools -name '*.js' -not -path '*/node_modules/*' | sort); do
            echo "$f"
            if grep -qE '^(import|export) ' "$f"; then node --input-type=module --check < "$f"; else node --check "$f"; fi
          done

  browser:
    runs-on: ubuntu-latest
    # Lokal (24.11.2026, offline, Chromium vorinstalliert, 4 Kerne) brauchte die Folge 436 s, in der Nachprüfung unter
    # Last 509 s, davon gremien.js 245 s; 30 Minuten sind die Untergrenze, das 3,5-Fache von 509 s, mit Reserve für die
    # Installation von Chromium samt Systempaketen und langsamere Läufer. Der zweite Bau mit den Themenseiten kam am
    # 25.11.2026 hinzu (lokal 22 s, themen.js 46 bis 53 s; der ganze Job lokal 764 s, parallel zu pytest)
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt pytest
      # Playwright und axe-core in festen Versionen aus tests/browser/package-lock.json (mit Prüfsummen), ohne
      # Installationsskripte; danach nur die Headless Shell von Chromium mit den Systempaketen
      - name: Playwright und axe-core
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright --version
      - name: Chromium für Playwright
        id: chromium
        working-directory: tests/browser
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium

      # Ab hier ohne Netz: Der tote Proxy (127.0.0.1:9) lässt jede Anfrage nach außen scheitern, statt dass sie die
      # Stadt erreicht; nur 127.0.0.1 und localhost sind direkt erreichbar. Nur die großgeschriebenen Namen: GitHub
      # liest die Schlüssel unter env laut actionlint ohne Unterschied der Groß- und Kleinschreibung (http_proxy neben
      # HTTP_PROXY wäre doppelt); Python (urllib) liest beide Schreibweisen, curl ALL_PROXY. RATSATLAS_SPERRE
      # (Sperrdatei abruf.lock, pipeline/dienste.py) liegt im Temp-Ordner des Läufers, nie in ~/.cache. Die Pipeline
      # arbeitet nur mit den erfundenen Vorlagen aus tools/testdaten.py („[Testdaten]“, example.invalid), die nie
      # veröffentlicht werden. Der erste Bau läuft ohne Themenseiten, gleich, ob sie im Repository freigegeben sind
      # (Prüfschalter RATSATLAS_THEMEN_PRUEFUNG=aus, wirkt nur mit Testdaten): Diese Testdaten haben keinen
      # Mobilitätsausschuss nach § 17; die Themenseiten prüft der zweite Bau unten.
      - name: Seite mit Testdaten bauen
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          RATSATLAS_THEMEN_PRUEFUNG: aus
        run: |
          mkdir -p "$RATSATLAS_SPERRE"
          python tools/testdaten.py
          python -m pipeline build
          python -m pipeline export
          python -m pipeline kontext
          python -m pipeline ebenen
          python -m pipeline check
          python -m pipeline package
          python tools/seite_bauen.py _site
          python tools/linkpruefung.py _site
      - name: Seite unter 127.0.0.1:8790
        id: seite
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
        run: |
          nohup python3 -m http.server --bind 127.0.0.1 8790 -d _site > "$RUNNER_TEMP/http_server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --noproxy 127.0.0.1 --output /dev/null http://127.0.0.1:8790/; then
              echo "Seite antwortet nach $i Versuch(en)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Die Seite unter 127.0.0.1:8790 antwortet nicht"
          exit 1
      # Jede Prüfung endet mit Exit-Code 1 bei einem Befund; die übrigen laufen trotzdem, solange die Seite antwortet
      - name: Gremien und Ämter im Browser
        if: ${{ !cancelled() && steps.seite.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
        run: node tests/browser/gremien.js http://127.0.0.1:8790/ "$RUNNER_TEMP/gremien.json"
      - name: Navigation im Browser
        if: ${{ !cancelled() && steps.seite.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
        run: node tests/browser/navigation.js http://127.0.0.1:8790/ "$RUNNER_TEMP/navigation.json"
      - name: Bedienung im Browser
        if: ${{ !cancelled() && steps.seite.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
        run: node tests/browser/bedienung.js http://127.0.0.1:8790/ "$RUNNER_TEMP/bedienung.json"
      # WCAG 2.1 A/AA (axe-core) und Tab-Reihenfolge in vier Größen; 320 × 256 entspricht 1280 × 1024 bei 400 % Zoom
      - name: WCAG-Prüfung in vier Größen
        if: ${{ !cancelled() && steps.seite.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          PORT: "8790"
        run: |
          fehler=0
          for groesse in 1440x900 1024x768 390x844 320x256; do
            echo "::group::WCAG $groesse"
            BREITE="${groesse%x*}" HOEHE="${groesse#*x}" node tools/wcag_pruefen.js "$RUNNER_TEMP/wcag_$groesse.tsv" "$RUNNER_TEMP/tastatur_$groesse.txt" || fehler=1
            echo "::endgroup::"
          done
          exit "$fehler"
      # Prüfbogen der Geokodierung (tools/pruefbogen.html, kein Teil der Seite; über file://, ohne Server):
      # tests/browser/pruefbogen.js mit den Erwartungen in tests/test_praezision.py, im Job „test“ übersprungen (dort
      # ist Chromium nicht installiert)
      - name: Prüfbogen im Browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
          RATSATLAS_BROWSER: "1"
        run: python -m pytest -q tests/test_praezision.py -k test_pruefbogen_im_browser
      # Themenseiten (Entscheidung 24.11.2026 (3)): zweiter Bau mit Testdaten in einen eigenen Ordner, nach allen Prüfungen
      # des ersten Baus (dieser und die WCAG-Prüfung oben laufen ohne Themenseiten, Prüfschalter „aus“).
      # tools/testdaten.py --themen ergänzt Gremien, Vorlagen und Sitzungen zum Thema; der Prüfschalter
      # RATSATLAS_THEMEN_PRUEFUNG=verkehr schaltet das Thema für diesen Bau ein, gleich, was im Repository steht, und wirkt
      # nur mit Testdaten (STAND.json „testdaten“, pipeline/config.py). Wie oben ohne Netz.
      - name: Seite mit Themenseiten bauen (Testdaten)
        id: themen_bau
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          RATSATLAS_THEMEN_PRUEFUNG: verkehr
        run: |
          mkdir -p "$RATSATLAS_SPERRE"
          python tools/testdaten.py --themen
          python -m pipeline build
          python -m pipeline export
          python -m pipeline kontext
          python -m pipeline ebenen
          python -m pipeline check
          python -m pipeline package
          python tools/seite_bauen.py _site_themen
          python tools/linkpruefung.py _site_themen
      - name: Seite mit Themenseiten unter 127.0.0.1:8791
        id: themen_seite
        if: ${{ !cancelled() && steps.themen_bau.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
        run: |
          nohup python3 -m http.server --bind 127.0.0.1 8791 -d _site_themen > "$RUNNER_TEMP/http_server_themen.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --noproxy 127.0.0.1 --output /dev/null http://127.0.0.1:8791/thema/verkehr-und-mobilitaet/; then
              echo "Themenseite antwortet nach $i Versuch(en)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Die Themenseite unter 127.0.0.1:8791 antwortet nicht"
          exit 1
      # Übersicht und Themenseite in 1440 × 900, 1024 × 768, iPhone 13 und 320 × 256: axe in jedem Zustand, Bedienung mit
      # Tastatur und Zeiger, stehende Bahnnamen, Legende außerhalb des Bildes, Tabellen mit Spaltennamen auf dem Telefon
      - name: Themenseiten im Browser
        if: ${{ !cancelled() && steps.themen_seite.outcome == 'success' }}
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
          NODE_PATH: ${{ github.workspace }}/tests/browser/node_modules
          AXE_PFAD: ${{ github.workspace }}/tests/browser/node_modules/axe-core/axe.min.js
        run: node tests/browser/themen.js http://127.0.0.1:8791/ "$RUNNER_TEMP/themen.json"
