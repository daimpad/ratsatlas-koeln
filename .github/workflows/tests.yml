# Tests der Pipeline mit synthetischen Daten und lokalem Testserver; keine Anfragen an Server der Stadt Köln
# (Entscheidung 04.11.2026: einziger aktiver Workflow bis Phase 5).
name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Pipeline (Abruf gegen Testserver, Aufbereitung, Geokodierung, Geodaten)
        run: python -m pytest -v tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Syntax der Webseite
        run: for f in site/app.js site/timeline.js site/tour.js site/rss.js site/technik.js; do node --check "$f"; done
