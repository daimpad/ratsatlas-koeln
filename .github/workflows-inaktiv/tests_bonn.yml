name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# Ein neuer Push bricht ältere Läufe desselben Pull Requests ab; Läufe auf main laufen vollständig.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit-Tests (Akteure, Geokodierung, Prozessschritte, Feeds und Kalender, Chat-Daten)
        run: python -m unittest discover tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Syntax der Webseite
        run: node --check site/app.js && node --check site/timeline.js && node --check site/tour.js && node --check site/prozesse.js && node --check site/beteiligung.js && node --check site/haushalt.js && node --check site/rss.js && node --check site/chat/tools.js && node --check site/chat/providers.js && node --check site/chat/core.js && node --check site/chat/keys.js && node --check site/chat/prompt.js && node --check site/chat/render.js && node --check site/chat/ui.js && node --check eval/run.mjs
      - name: Ratsassistent (Werkzeuge, Adapter, Chat-Kern, Darstellung, Fragenkatalog)
        run: node --test "tests/js/**/*.test.mjs"

  # Browser-Prüfung der fertigen Seite mit echten Daten. Rohdaten aus dem Zwischenspeicher des täglichen
  # Laufs (pages.yml, nur lesen; gleiche Pfadliste), sonst neuer Abruf.
  browser:
    # fest auf 24.04: Playwright 1.56 installiert Chromium nicht auf ubuntu-latest (26.04, Stand 27.10.2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rohdaten des letzten Laufs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            data/raw/papers.jsonl
            data/raw/consultations_lite.jsonl
            data/raw/organizations.json
            data/raw/verwaltungsbereiche.json
            data/raw/STAND.json
            data/raw/meetings.json
            data/raw/legislative_terms.json
            data/raw/besetzung.json
          key: raw-browser
          restore-keys: raw-
      - name: Abruf, falls kein Zwischenspeicher vorhanden ist
        if: hashFiles('data/raw/papers.jsonl') == ''
        run: |
          python -m pipeline fetch-papers
          python -m pipeline fetch-lite
      - name: Aufbereiten und Export
        run: |
          python -m pipeline build
          python -m pipeline export
          python -m pipeline kontext
          python -m pipeline soll
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/data/geo
          cp -r site/. _site/
          cp -r data/export _site/data/
          cp data/LICENSE-DATA.md _site/data/
          cp data/geo/*.geojson _site/data/geo/
          # Vorschau der Ebenen 2 und 3 des Haushalts (Produktgruppen, Aufwandsarten) bis zur Freigabe, damit sie geprüft werden
          HAUSHALT_EBENEN=vorschau HAUSHALT_ERWEITERUNG=vorschau HAUSHALT_ERTRAGSARTEN=vorschau SITE_URL=http://localhost:8765/ python -m pipeline seo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Playwright und axe-core
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser-Prüfung (Start, Karte, Vorgang, Prozesse, Mitmachen, mobil, Tour, Themenseite; WCAG 2.1 AA)
        run: |
          python -m http.server -d _site 8765 > /dev/null 2>&1 &
          node --test "tests/browser/*.test.mjs"
