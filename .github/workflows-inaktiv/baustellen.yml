# Archiv der Kölner Zusatzthemen „Baustellen Köln“ (WFS des Geoportals) und „Sag’s uns“ (Open311) im Branch `archiv`
# (pipeline/baustellen.py, pipeline/anliegen.py, Abruf über pipeline/dienste.py). INAKTIV: liegt unter
# .github/workflows-inaktiv und läuft nicht (vorbereitet am 16.11.2026 ohne Abruf; Einschalten nach TECHNIK.md,
# „Baustellen und Sag’s uns“).
#
# Sperren (alle nötig, sonst wird nichts gesendet und nichts geschrieben):
# - Zusatzthema in pipeline/config.py ZUSATZTHEMEN eingeschaltet („baustellen“, „anliegen“; ohne bricht der Schritt
#   mit „deaktiviert“ ab);
# - eigene Freigabe des täglichen Abrufs je Dienst: Repository-Variablen BAUSTELLEN_ABRUF und ANLIEGEN_ABRUF = „ja“
#   (Entscheidung 16.11.2026: tägliche Abrufe an weitere Server der Stadt brauchen eine eigene Freigabe);
# - RATSATLAS_STADT_INFORMIERT = „ja“ und das Zeitfenster 23–1 Uhr Ortszeit (beide Hosts sind Server der Stadt);
# - RATSATLAS_KONTAKT (Kontakt im User-Agent, Pflicht).
# Je Lauf höchstens 2 Anfragen an den WFS und 14 an Open311 (erster Lauf 13, danach 5), mindestens 2 s Abstand, keine
# Wiederholung. Passt eine Antwort nicht zu den erwarteten Feldern, schreibt der Schritt nichts und endet rot.
# Offen vor dem Einschalten: ob dieser Lauf neben dem nächtlichen Abruf der OParl-API (pages.yml, ab 22:10 UTC) laufen
# darf (andere Hosts derselben Stadt) oder danach; die Uhrzeit unten liegt im Zeitfenster (MEZ und MESZ).
name: Archiv (Baustellen, Sag’s uns)

on:
  schedule:
    - cron: "41 22 * * *"   # 23:41 MEZ, 00:41 MESZ
  workflow_dispatch:

permissions:
  contents: write   # Branch archiv

concurrency:
  group: "archiv"
  cancel-in-progress: false

jobs:
  archiv:
    runs-on: ubuntu-latest
    env:
      RATSATLAS_STADT_INFORMIERT: ${{ vars.RATSATLAS_STADT_INFORMIERT }}
      RATSATLAS_KONTAKT: ${{ vars.RATSATLAS_KONTAKT }}
      BAUSTELLEN_ABRUF: ${{ vars.BAUSTELLEN_ABRUF }}
      ANLIEGEN_ABRUF: ${{ vars.ANLIEGEN_ABRUF }}
      BAUSTELLEN_ARCHIV: _archiv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Branch archiv holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Exit-Code 2: Branch fehlt; jeder andere Fehler (Netz) bricht ab, statt mit leerem Bestand weiterzumachen
          rc=0; git ls-remote --exit-code --heads "$url" archiv > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "Abfrage des Branches archiv gescheitert ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git clone -q --depth 1 --branch archiv "$url" _archiv
          else
            git init -q -b archiv _archiv
          fi

      - name: Baustellen abrufen und archivieren
        id: baustellen
        env:
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre   # Sperrdatei abruf.lock (eine Verbindung)
        run: python -m pipeline baustellen
        continue-on-error: true

      - name: Sag’s uns abrufen und archivieren
        id: anliegen
        env:
          RATSATLAS_SPERRE: ${{ runner.temp }}/sperre
        run: python -m pipeline anliegen
        continue-on-error: true

      - name: Archiv sichern
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _archiv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Archiv unverändert"; exit 0; fi
          git commit -q -m "Archiv $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:archiv

      - name: Ergebnis
        if: steps.baustellen.outcome != 'success' || steps.anliegen.outcome != 'success'
        run: |
          echo "Baustellen: ${{ steps.baustellen.outcome }}, Sag’s uns: ${{ steps.anliegen.outcome }}"
          exit 1
